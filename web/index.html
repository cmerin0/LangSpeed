<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LangSpeed</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f1115;
      color: #e6e8eb;
    }
    main {
      width: min(34rem, calc(100vw - 3rem));
      padding: 2.5rem;
      border: 1px solid #262a33;
      border-radius: 14px;
      background: #151922;
      text-align: center;
    }
    h1 { margin: 0 0 .35rem; font-size: 2.1rem; letter-spacing: .02em; }
    h1 span { color: #6ea8fe; }
    p { margin: .75rem 0; line-height: 1.55; color: #aeb4bf; }
    a {
      display: inline-block;
      margin-top: .5rem;
      padding: .55rem 1.1rem;
      border-radius: 8px;
      background: #6ea8fe;
      color: #0f1115;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #86b9ff; }
    .muted { font-size: .85rem; color: #6b7280; }
    code { background: #1f2430; padding: .1rem .35rem; border-radius: 5px; color: #cbd2dc; }
  </style>
</head>
<body>
  <main>
    <h1>Lang<span>Speed</span></h1>
    <p>The walking skeleton is up: Go server, PostgreSQL and Redis are running via Docker Compose.</p>
    <p><a href="/healthz">Check backend health</a></p>
    <p class="muted">Next: game session API (R3-R6), typing mechanics (R7-R9), leaderboard (R10-R12), admin panel (R13-R17), game UI (R18-R19).</p>
    <p class="muted">Health endpoint: <code>GET /healthz</code></p>
  </main>
</body>
</html>
